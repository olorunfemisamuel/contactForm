<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
 <h1>Contact Us</h1>
  <form action="" id="contactForm">

<!----firstname-->
    <div class="form-group">
      <label for = "name">First name</label>
      <input type = "text" id="name" name="name" aria-describedby="nameError" >
      <span class="error" id="nameError" aria-live="polite"></span>
    </div>

    <!----lastname-->
<div class="form-group">
 <label for="name">Last Name</label>
 <input type="text" id="lastName" name="name" >
 <span class="error" id="lastNameError" a-live="polite"></span>
</div>

<!----Email-->
<div class="form-group">
  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" >
  <span class="error" id="emailError" a-live="polite"></span>
</div>

<!----Query-->
<div class="form-group">
  <label for="queryType">Query Type</label>
 <input type="radio" id="queryType" name="queryType" value="general"> General Inquiry
 <input type="radio" id="queryType" name="queryType" value="support"> Support
<span class="error" id="queryTypeError" a-live="polite"></span>
</div>


<!----message-->
<div class="form-group">
  <label for="message">Message</label>
  <textarea id="message" name="message" ></textarea>
  <span class="error" id="messageError"></span>
</div>

<!----consent-->
<div class="form-group">
    <label for="consent"> I consent to being contacted by the team</label>
  <input type="checkbox" id="consent" name="consent">
  <span class="error" id="consentError"  ></span>
</div>

<div class="form-actions">
  <button type="submit" id="submit">Submit</button>
</div>

  </form>
  </main>

 <script src="script.js"></script>

</body>
</html>
